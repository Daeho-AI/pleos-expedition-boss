<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="차량의 주행거리를 필살기로 바꾸고, 주차 중 사냥과 장비 수집을 즐기는 원정 보스 시연 영상">
<title>원정 보스 시연</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#192321;background:#f7f8f6;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.65}main{max-width:1120px;margin:auto;padding:48px 24px 56px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:30px;letter-spacing:-.04em;margin:0}header a{color:inherit;text-underline-offset:4px}.intro{font-size:18px;max-width:770px;margin:12px 0 28px;word-break:keep-all}.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{border:1px solid #c5ccc7;border-radius:8px;background:transparent;padding:12px 18px;font:inherit;font-weight:600;color:#48534d;cursor:pointer}.tabs button[aria-pressed="true"]{color:#fff;background:#1f4136;border-color:#1f4136}button:focus-visible,a:focus-visible{outline:3px solid #397f65;outline-offset:4px}video{display:block;width:100%;background:#111;border-radius:10px;aspect-ratio:16/10}h2{font-size:20px;margin:24px 0 6px}p{margin:0 0 14px}.note{color:#616b65;font-size:14px;word-break:keep-all}footer{margin-top:28px;display:flex;gap:24px;flex-wrap:wrap}footer a{color:#234d3b;text-underline-offset:4px}@media(max-width:600px){main{padding:24px 16px}header{align-items:flex-start}h1{font-size:26px}.intro{font-size:16px}.tabs button{padding:10px 13px}header a{font-size:14px}}
</style>
</head>
<body><main>
<header><h1>원정 보스</h1><a href="https://github.com/Daeho-AI/pleos-expedition-boss">GitHub</a></header>
<p class="intro">주행을 마치면 필살기 한 방.<br>주차 중에는 보스를 잡고 장비를 키우는 방치형 RPG입니다.</p>
<div class="tabs" aria-label="시연 영상 선택">
<button type="button" data-video="vehicle" aria-pressed="true">차량 연동 · 90초</button>
<button type="button" data-video="game" aria-pressed="false">게임 화면 · 1분</button>
</div>
<video id="player" controls playsinline preload="metadata" poster="video/poster.jpg" src="video/vehicle-demo.mp4" aria-label="차량 연동 시연 영상">
<a href="video/vehicle-demo.mp4">시연 영상 내려받기</a>
</video>
<h2 id="heading">주행 중에는 멈추고, 도착하면 보상을 받습니다.</h2>
<p id="summary">출발과 주차, 주행거리 필살기, 충전 대기 중 자동 사냥, 장비 성장과 친구 교환을 보여 줍니다.</p>
<p class="note" id="note">공식 Pleos 에뮬레이터에서 촬영했습니다. 10km 이동과 7분 경과는 가상 입력이며, 친구 장면은 교환 결과를 보여 줍니다.</p>
<footer><a id="download" href="video/vehicle-demo.mp4" download>영상 내려받기</a><a href="https://github.com/Daeho-AI/pleos-expedition-boss/raw/refs/heads/main/apk/모아_원정보스_release.apk">APK 내려받기</a><a href="https://github.com/Daeho-AI/pleos-expedition-boss#실행-방법">실행 방법</a></footer>
</main>
<script>
const videos={vehicle:{src:'video/vehicle-demo.mp4',title:'차량 연동 시연 영상',heading:'주행 중에는 멈추고, 도착하면 보상을 받습니다.',summary:'출발과 주차, 주행거리 필살기, 충전 대기 중 자동 사냥, 장비 성장과 친구 교환을 보여 줍니다.',note:'공식 Pleos 에뮬레이터에서 촬영했습니다. 10km 이동과 7분 경과는 가상 입력이며, 친구 장면은 교환 결과를 보여 줍니다.',poster:'video/poster.jpg'},game:{src:'video/gameplay.mp4',title:'게임 화면 시연 영상',heading:'장비를 모으고, 다음 보스에 도전합니다.',summary:'원정 화면에서 장비를 고르고 보상을 확인합니다. 상점, 친구, 도감도 함께 살펴볼 수 있습니다.',note:'제출 APK의 게임 화면입니다. 차량 연동 영상과 촬영 시점이 달라 화면 구성이 일부 다릅니다.',poster:'video/gameplay-poster.png'}};
document.querySelectorAll('[data-video]').forEach(button=>button.addEventListener('click',()=>{const v=videos[button.dataset.video],p=document.getElementById('player');p.pause();p.src=v.src;p.poster=v.poster;p.setAttribute('aria-label',v.title);p.load();document.getElementById('heading').textContent=v.heading;document.getElementById('summary').textContent=v.summary;document.getElementById('note').textContent=v.note;document.getElementById('download').href=v.src;document.querySelectorAll('[data-video]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
</script>
</body></html>
